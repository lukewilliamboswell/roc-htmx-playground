name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  ROC_NIGHTLY_TAG: nightly-2026-July-27-f4b3c60

jobs:
  publish:
    name: Validate and publish release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Validate application
        run: roc scripts/tasks.roc check

      - name: Build release artifacts
        run: roc scripts/tasks.roc release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: roc-htmx-playground-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/roc-htmx-playground-x64-linux \
            dist/roc-htmx-playground-arm64-linux \
            dist/roc-htmx-playground-x64-macos \
            dist/roc-htmx-playground-arm64-macos \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
